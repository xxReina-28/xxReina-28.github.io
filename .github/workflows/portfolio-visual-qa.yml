name: Portfolio visual QA

on:
  push:
    branches:
      - portfolio-rebrand-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-visual-qa:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      JEKYLL_ENV: production
      QA_OUTPUT_DIR: ${{ runner.temp }}\portfolio-visual-qa

    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up repository Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Validate publishable source
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-site.ps1 -SourceOnly

      - name: Build production Jekyll site
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:JEKYLL_ENV = "production"
          bundle exec jekyll build --trace
          if ($LASTEXITCODE -ne 0) {
            throw "Production Jekyll build failed with exit code $LASTEXITCODE."
          }

      - name: Validate generated routes and assets
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-site.ps1

      - name: Set up Node.js for browser QA
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned Playwright browser runtime
        shell: powershell
        run: |
          npm.cmd install --no-save --no-package-lock playwright@1.60.0
          npx.cmd playwright install chromium

      - name: Run Chromium route and visual QA
        shell: powershell
        run: node .\scripts\portfolio-visual-qa.mjs

      - name: Upload rendered site
        if: ${{ always() && hashFiles('_site/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-rendered-site
          path: _site
          retention-days: 7
          if-no-files-found: error

      - name: Upload screenshots and QA report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-visual-qa-evidence
          path: |
            ${{ env.QA_OUTPUT_DIR }}\screenshots
            ${{ env.QA_OUTPUT_DIR }}\portfolio-visual-qa-report.json
            ${{ env.QA_OUTPUT_DIR }}\portfolio-visual-qa-report.md
          retention-days: 7
          if-no-files-found: warn
