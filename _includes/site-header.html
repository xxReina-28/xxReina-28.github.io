<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Niña Suico home">
      Niña Suico
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <ul class="site-nav__list">
        {% for item in site.data.navigation %}
          {% assign item_url = item.url | relative_url %}
          {% assign is_current = false %}
          {% if page.url == item.url %}
            {% assign is_current = true %}
          {% endif %}
          <li>
            <a class="site-nav__link{% if is_current %} is-current{% endif %}"
               href="{{ item_url }}"{% if is_current %} aria-current="page"{% endif %}>
              {{ item.label }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
