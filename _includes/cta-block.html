{% assign cta = include.cta %}
{% if cta.status == 'approved' %}
  <aside class="card glass-surface cta-block" data-cta-id="{{ cta.id }}" aria-labelledby="cta-{{ cta.id }}">
    <h2 id="cta-{{ cta.id }}">{{ cta.heading }}</h2>
    {% if cta.body %}<p>{{ cta.body }}</p>{% endif %}
    {% if cta.url and cta.label %}
      <div class="btn-row">
        <a class="btn" href="{{ cta.url | relative_url }}">{{ cta.label }}</a>
      </div>
    {% endif %}
  </aside>
{% endif %}
